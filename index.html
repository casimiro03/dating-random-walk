<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Camino del Borracho 🥴</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: white;
            overflow: hidden; /* Evitar scroll */
            touch-action: none; /* Mejorar comportamiento táctil */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            z-index: 10;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .ui-content {
            pointer-events: auto; 
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .fade-out { animation: fadeOut 0.5s ease-out forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            transition: all 0.2s;
        }
        .btn-whatsapp:hover { background-color: #128C7E; }
    </style>
</head>
<body class="h-screen w-screen relative">

    <canvas id="walkCanvas"></canvas>

    <!-- Pantalla de Inicio -->
    <div id="startScreen" class="ui-layer">
        <div class="ui-content p-8 rounded-2xl shadow-2xl text-center max-w-sm w-11/12">
            <h1 class="text-3xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
                Biased Random Walk
            </h1>
            <p class="text-gray-300 mb-6 text-sm">
                Algoritmo de decisión estocástica. Dejemos que la matemática decida nuestro destino de hoy.
            </p>

            <button id="startBtn" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-bold py-4 px-6 rounded-xl shadow-lg transform transition active:scale-95 text-lg">
                Generar Ruta 🐈
            </button>
        </div>
    </div>

    <!-- Pantalla de Resultados -->
    <div id="resultScreen" class="ui-layer hidden opacity-0">
        <div class="ui-content p-8 rounded-2xl shadow-2xl text-center max-w-sm w-11/12">
            <p class="text-gray-400 font-bold tracking-widest uppercase text-xs mb-2">Destino calculado</p>
            <h2 id="winnerName" class="text-4xl font-black mb-6 text-white drop-shadow-md">
                Destino
            </h2>
            <p class="text-gray-300 mb-6 text-sm italic">
                La función de onda ha colapsado.
            </p>
            
            <button id="shareBtn" class="w-full btn-whatsapp font-bold py-3 px-6 rounded-xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2 mb-3">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                Mandar Veredicto
            </button>
            <button id="retryBtn" class="w-full bg-transparent border border-gray-600 hover:bg-gray-800 text-gray-300 font-bold py-3 px-6 rounded-xl transition">
                Volver a simular
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('walkCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const resultScreen = document.getElementById('resultScreen');
        const startBtn = document.getElementById('startBtn');
        const retryBtn = document.getElementById('retryBtn');
        const shareBtn = document.getElementById('shareBtn');
        const winnerNameEl = document.getElementById('winnerName');

        const locales = [
            "Volim'te",
            "Yenny",
            "Mecakes",
            "Chale monte y bar",
            "El café de zaramika"
        ];

        let width, height;
        let animationId;
        let isSimulating = false;
        let destinations = [];
        let targetIndex = 0;
        let path = [];
        let walker = { x: 0, y: 0 };
        
        const walkerImgW = 90; // ancho del gato (el alto se calcula por proporción)
        let walkerImgH = 61;
        const destinationRadius = 40;
        
        // Manejo ultra seguro de la imagen para que nunca se trabe
        const walkerImg = new Image();
        let isImgReady = false;
        
        walkerImg.onload = () => {
            walkerImgH = walkerImgW * (walkerImg.naturalHeight / walkerImg.naturalWidth);
            isImgReady = true;
        };
        // Esta es la ruta exacta que usará Vercel al estar en la misma carpeta
        walkerImg.src = "gato.png"; 
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if(!isSimulating && destinations.length > 0){
                setupDestinations();
                drawBase();
            }
        }
        window.addEventListener('resize', resize);

        function setupDestinations() {
            destinations = [];
            const centerX = width / 2;
            const centerY = height * 0.45;
            const radius = Math.min(width, height) * 0.35;

            for (let i = 0; i < locales.length; i++) {
                const marginX = width * 0.15;
                const safeX = marginX + (width - marginX * 2) * (i / (locales.length - 1));
                const x = safeX;
                const y = height * 0.2 + (i % 2 === 0 ? 0 : height * 0.12); 
                
                destinations.push({
                    name: locales[i],
                    x: x,
                    y: y,
                    color: `hsl(${i * 60 + 300}, 80%, 60%)`
                });
            }
        }

        function initSimulation() {
            walker = { x: width / 2, y: height * 0.85 };
            path = [{ x: walker.x, y: walker.y }];
            
            targetIndex = Math.floor(Math.random() * locales.length);
            
            isSimulating = true;
            animate();
        }

        function animate() {
            if (!isSimulating) return;

            const target = destinations[targetIndex];
            
            // Jitter aleatorio
            const jitter = width > 600 ? 30 : 25; 
            let dx = (Math.random() - 0.5) * jitter;
            let dy = (Math.random() - 0.5) * jitter;

            // Atracción hacia el destino elegido
            const biasStrength = width > 600 ? 2.5 : 1.8; 
            const dirX = target.x - walker.x;
            const dirY = target.y - walker.y;
            const dist = Math.sqrt(dirX * dirX + dirY * dirY);

            if (dist > 0) {
                dx += (dirX / dist) * biasStrength;
                dy += (dirY / dist) * biasStrength;
            }

            walker.x += dx;
            walker.y += dy;

            walker.x = Math.max(20, Math.min(width - 20, walker.x));
            walker.y = Math.max(20, Math.min(height - 20, walker.y));

            path.push({ x: walker.x, y: walker.y });

            drawBase(); 
            drawPath(); 
            drawWalker(); 

            if (dist < destinationRadius) {
                endSimulation(target.name);
                return; 
            }

            animationId = requestAnimationFrame(animate);
        }

        function drawBase() {
            ctx.clearRect(0, 0, width, height);

            destinations.forEach((dest, index) => {
                ctx.beginPath();
                ctx.arc(dest.x, dest.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = dest.color;
                ctx.shadowColor = dest.color;
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0; 
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 15px Inter';
                ctx.textAlign = 'center';
                ctx.fillText(dest.name, dest.x, dest.y - 25);
            });
        }

        function drawPath() {
            if (path.length < 2) return;
            
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawWalker() {
            const angle = (Math.random() - 0.5) * 0.6; 
            
            ctx.save();
            ctx.translate(walker.x, walker.y);
            ctx.rotate(angle);
            
            if (isImgReady) {
                ctx.drawImage(walkerImg, -walkerImgW / 2, -walkerImgH / 2, walkerImgW, walkerImgH);
            } else {
                // Fallback de emergencia por si algo falla, para que la app no se rompa visualmente
                ctx.font = `${walkerImgW * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("🐈", 0, 0);
            }
            
            ctx.restore();
        }

        function start() {
            startScreen.classList.remove('fade-in');
            startScreen.classList.add('fade-out');
            setTimeout(() => {
                startScreen.classList.add('hidden');
                setupDestinations();
                initSimulation();
            }, 500);
        }

        function endSimulation(winnerName) {
            isSimulating = false;
            
            drawBase();
            drawPath();
            
            const target = destinations[targetIndex];
            ctx.beginPath();
            ctx.arc(target.x, target.y, destinationRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            drawWalker(); 
            
            winnerNameEl.textContent = winnerName;
            resultScreen.classList.remove('hidden', 'fade-out');
            resultScreen.classList.add('fade-in');
        }

        function shareWhatsApp() {
            const winner = winnerNameEl.textContent;
            const mensaje = `🐈 Computando variables estocásticas...\n¡El algoritmo "Biased Random Walk" ha colapsado! \n\nNuestro destino es: *${winner}* 🍻\n\n¿Nos vemos ahí?`;
            
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        function restart() {
            resultScreen.classList.remove('fade-in');
            resultScreen.classList.add('fade-out');
            setTimeout(() => {
                resultScreen.classList.add('hidden');
                setupDestinations();
                initSimulation();
            }, 500);
        }

        startBtn.addEventListener('click', start);
        shareBtn.addEventListener('click', shareWhatsApp);
        retryBtn.addEventListener('click', restart);

        resize();
        setupDestinations();
        drawBase(); 
    </script>
</body>
</html>
